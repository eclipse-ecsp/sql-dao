# Schema-per-tenant on one database with Liquibase migrations. DB_URL_LIQUIBASE is set by the test.
multitenancy.enabled=true

sqldao.liquibase.enabled=true
sqldao.liquibase.change-log=classpath:db/changelog/db.changelog-flow-tenant.xml
sqldao.liquibase.public-change-log=classpath:db/changelog/db.changelog-flow-public.xml
sqldao.liquibase.retry.max-attempts=1
sqldao.liquibase.admin.appdb.jdbc-url=${DB_URL_LIQUIBASE}
sqldao.liquibase.admin.appdb.user-name=root
sqldao.liquibase.admin.appdb.password=root

tenants.profile.tenanta.jdbc-url=${DB_URL_LIQUIBASE}
tenants.profile.tenanta.schema=spring_a
tenants.profile.tenanta.user-name=root
tenants.profile.tenanta.password=root
tenants.profile.tenanta.driver-class-name=org.postgresql.Driver
tenants.profile.tenanta.pool-name=springAPool
tenants.profile.tenanta.max-pool-size=5
tenants.profile.tenanta.min-pool-size=1
tenants.profile.tenanta.connection-timeout-ms=1000
tenants.profile.tenanta.credential-provider-bean-name=org.eclipse.ecsp.sql.authentication.PostgresMultiTenantTestCredentialsProvider

tenants.profile.tenantb.jdbc-url=${DB_URL_LIQUIBASE}
tenants.profile.tenantb.schema=spring_b
tenants.profile.tenantb.user-name=root
tenants.profile.tenantb.password=root
tenants.profile.tenantb.driver-class-name=org.postgresql.Driver
tenants.profile.tenantb.pool-name=springBPool
tenants.profile.tenantb.max-pool-size=5
tenants.profile.tenantb.min-pool-size=1
tenants.profile.tenantb.connection-timeout-ms=1000
tenants.profile.tenantb.credential-provider-bean-name=org.eclipse.ecsp.sql.authentication.PostgresMultiTenantTestCredentialsProvider

postgres.credentials.refresh.enabled=false
postgres.connection.retry.count=3
postgres.connection.retry.delay=100
postgres.datasource.retry.count=3
postgres.datasource.retry.delay=100

logging.level.root=INFO

# No metrics server and no health checks in these tests
metrics.prometheus.enabled=false
postgresdb.metrics.enabled=false
prometheus.agent.port=9100
prometheus.agent.port.exposed=9100
postgresdb.health.enabled=false
service.name=liquibaseIntegrationTestService
